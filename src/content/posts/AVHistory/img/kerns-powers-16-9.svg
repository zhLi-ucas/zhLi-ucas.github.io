        <cc:license
           rdf:resource="http://creativecommons.org/licenses/by-sa/3.0/" />
        <dc:description>Dr. Kerns Powers proposed the 16:9 aspect ratio to the SMPTE after overlaying the 1.33, 1.667, 1.85, Panavision 2.2 and CinemaScope 2.35 formats in the way illustrated here.   The overlapped, equal area rectangles fit inside of a 16:9 rectangle and all enclose a smaller, common 16:9 rectangle.</dc:description>
        <dc:contributor>
          <cc:Agent>
            <dc:title>Mark Warren</dc:title>
          </cc:Agent>
        </dc:contributor>
        <dc:subject>
          <rdf:Bag>
            <rdf:li>HDTV</rdf:li>
            <rdf:li>16:9</rdf:li>
            <rdf:li>aspect ratio</rdf:li>
            <rdf:li>SMPTE</rdf:li>
            <rdf:li>Powers</rdf:li>
            <rdf:li>Kerns</rdf:li>
          </rdf:Bag>
        </dc:subject>
